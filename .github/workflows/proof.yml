name: proof

# Failure and recovery proofs (C10; R-12–R-15, T-240–T-243). Runs the real
# crab binary, built with -tags proof (test-only failpoints), against the
# runner's own PostgreSQL so the harness can stop it and fill its disk.

on:
  push:
  pull_request:

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CRAB_TEST_POSTGRES_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/crab_test?sslmode=disable
      CRAB_PROOF_PG_STOP: sudo pg_ctlcluster --mode fast 16 main stop
      CRAB_PROOF_PG_START: sudo pg_ctlcluster 16 main start && until pg_isready -h 127.0.0.1 -q; do sleep 1; done
      CRAB_PROOF_FULL_DIR: /mnt/pgfull
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the upgrade proof builds the baseline release, 66b188a
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: PostgreSQL on the runner, and a small filesystem for disk-full
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql
          until pg_isready -h 127.0.0.1 -q; do sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo -u postgres createdb crab_test
          sudo mkdir -p /mnt/pgfull
          sudo mount -t tmpfs -o size=24m tmpfs /mnt/pgfull
          sudo chown postgres:postgres /mnt/pgfull
          psql --version
      - name: Release build contains no failpoints
        shell: bash
        run: |
          set -euo pipefail
          go build -o /tmp/crab ./cmd/crab
          if grep -aq CRAB_FAILPOINT /tmp/crab; then echo "failpoints in release build"; exit 1; fi
      - name: Destructive, database and storage, backup and restore, upgrade
        run: go test -tags proof -count=1 -v -run '^TestProof' ./cmd/crab
