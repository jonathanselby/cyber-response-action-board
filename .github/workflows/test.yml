name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRAB_TEST_POSTGRES_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/crab_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Module contract
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format contract
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l ./cmd ./internal)
          if [ -n "$files" ]; then
            echo "Go files requiring gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit and PostgreSQL integration tests with race detector
        run: go test -race -count=1 ./...
      - name: Linux amd64 build
        run: go build -trimpath -ldflags="-s -w" -o ./bin/crab ./cmd/crab
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ./bin/crab-linux-arm64 ./cmd/crab
      - name: Core checkpoint acceptance
        run: >-
          go test ./internal/ledger ./internal/data/postgres ./internal/security/... ./internal/domain ./internal/app ./internal/presentation/web ./internal/architecture ./cmd/crab
          -run 'TestVerifyValidLedger|TestVerifyDetectsTamper|TestVerifyDetectsBrokenChain|TestRecordCannotCarryGovernedDecision|TestSystemRecordMayOmitIncidentID|TestMigrationSeparatesOwnerAndRuntime|TestAppendReplayRollbackTamperAndExport|TestSecurityStoreLocalAuthAndSessions|TestAccessProjectionAndPrincipalAreDenyByDefault|TestIsolateModeIsGovernedAndRebuildable|TestIsolateModeRefusesFederationBeforeVerification|TestBreakGlassRequiresExactlyTwoDistinctValidKeyholders|TestCallbackUsesOnlyPreRegisteredRoute|TestMajorHasNoUniversalIncidentVisibility|TestRestrictedCompartmentRequiresExplicitMembership|TestOutputPermissionIsSeparateFromRead|TestCustodianDoesNotGainIncidentContent|TestObjectIDSubstitutionCannotBypassScope|TestAgentCannotExceedNamedHuman|TestAgentCannotSwapNamedHuman|TestBootstrapCreatesNoIncidentVisibility|TestCustodianRecoveryRestoresCustodiansOnly|TestBreakGlassCreatesAuthenticationSessionWithoutAuthority|TestBreakGlassAlertFailureDoesNotCancelAuthentication|TestBootstrapRecordsCanBeHumanSignedAndLedgered|TestRecordFactIsImmediateAndCannotCarryGovernedState|TestGovernedProposalCapturesExactPayloadVersion|TestDecideEnforcesDifferentHuman|TestUnknownAndHypothesisRemainDistinct|TestSemanticProposalSchemasRemainDedicated|TestIncidentProjectionBuildsSemanticOperatingPicture|TestRejectedProposalNeverBecomesEffective|TestControlledActionCannotUseImmediateRecordSemantic|TestDecisionCannotChangeProposalIncidentMode|TestIncidentServiceEndToEndThroughLedgerAndPostgres|TestIncidentServiceRecordAndProposeRoleBoundaries|TestMajorMayProposeNewIncidentWithoutExistingMembership|TestDecideReloadsStoredProposalAndEnforcesMakerChecker|TestShellIsOfflineAndSecurityHeadersArePresent|TestTierImportBoundaries|TestReadinessFailsClosedBeforeConfiguredDurableStore'
          -count=1
