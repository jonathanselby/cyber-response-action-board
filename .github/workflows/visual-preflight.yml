name: visual-preflight

on:
  push:
  pull_request:

jobs:
  visual-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Visual and accessibility preflight
        run: ./scripts/visual-acceptance-preflight.sh
