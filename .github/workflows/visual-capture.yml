name: visual-capture

# Screenshots of every screen with seeded data, plus sample PDFs, for human
# visual review (T-211, T-212). Evidence only: it gates nothing.
on:
  workflow_dispatch:
  push:
    branches: ['uat2/**']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRAB_TEST_POSTGRES_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/crab_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Capture screens and PDFs
        run: ./scripts/visual-capture.sh visual-capture
      - name: Publish to the visual-capture branch (single orphan commit)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          for f in visual-capture/shots/*.png; do
            convert "$f" -quality 82 "publish/$(basename "${f%.png}").jpg"
          done
          cp visual-capture/pdf/*.pdf publish/
          cd publish
          git init -q
          git checkout -q -b ci/visual-capture
          git -c user.name=ci -c user.email=ci@localhost add .
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "visual capture for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci/visual-capture
      - uses: actions/upload-artifact@v4
        with:
          name: visual-capture
          path: |
            visual-capture/shots
            visual-capture/pdf
          retention-days: 14
