name: bafflewick

on:
  push:
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRAB_TEST_POSTGRES_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/crab_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Bafflewick end-to-end acceptance
        run: ./scripts/bafflewick-acceptance.sh
